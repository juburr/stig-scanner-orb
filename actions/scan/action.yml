name: Run an OpenSCAP STIG scan
description: >
  Runs an OpenSCAP STIG scan against a container image, extracted through the
  runner's Docker daemon, or against an already-extracted filesystem tree.
  Writes report.html, results.xml and scan-plan.env (what ran: image
  references and digests, the datastream and its sha256) into output_dir. It
  enforces no gate: run the summarize action after it. Needs a Linux runner
  with Docker, bash and Python 3, such as ubuntu-24.04. The GitHub Actions twin
  of the orb's scan command.
author: juburr

inputs:
  image:
    description: >
      Image tag to scan, such as myapp:latest or
      cgr.dev/chainguard/static:latest. If the tag isn't in the runner's
      Docker daemon already (from the load_image action, say), the scan pulls
      it. Mutually exclusive with rootfs_path.
    default: ""
  rootfs_path:
    description: >
      Path to an already-extracted, offline filesystem tree, such as a mounted
      VM disk. Never a live filesystem such as /: symlinks are resolved, and a
      tree containing a socket, FIFO or device node (extract without dev/), or
      overlapping output_dir or TMPDIR, is refused. Mutually exclusive with
      image.
    default: ""
  target_base:
    description: >
      auto, wolfi, debian12, ubuntu2204, rhel8, rhel9, rhel10 or fedora.
      Selects the scanner image, datastream and profile. auto reads
      /etc/os-release from the target rootfs, falling back to filesystem-shape
      hints (apk DB is wolfi, rpm DB is rhel9, dpkg status or the distroless
      status.d/ layout is debian12) when the image has none. If none of those
      match, set it explicitly.
    default: auto
  scanner_image:
    description: >
      Override the scanner image. Empty uses the orb's digest-pinned default:
      cgr.dev/chainguard/openscap (latest-dev) for wolfi, debian12 and
      ubuntu2204, quay.io/compliance-operator/openscap-ocp (1.3.6) for rhel8,
      rhel9, rhel10 and fedora; the README lists the exact digests. Pin an
      override by digest too (name:tag@sha256:...): a tag-only reference is
      used as found in the local daemon.
    default: ""
  datastream_name:
    description: >
      Override the SCAP datastream filename, a file name rather than a path.
      Use it to scan against a non-default OS variant whose datastream lives
      alongside the default one.
    default: ""
  datastream_path:
    description: >
      Path on the runner to a datastream file. Bypasses the donor flow
      entirely, for air-gapped consumers who mirror SCAP content through their
      own pipeline.
    default: ""
  checklist_answers:
    description: >
      Runner-readable, release-bound site answers JSON (at most 1 MiB),
      outside output_dir. Protected from output cleanup; pass the same file to
      the generate_checklist action, which applies it.
    default: ""
  tailoring_file:
    description: >
      XCCDF 1.2 tailoring XML on the runner (at most 16 MiB). Snapshotted and
      hashed offline; profile_id must name a profile in this file extending a
      profile from the scanned benchmark.
    default: ""
  profile_id:
    description: >
      Override the XCCDF profile id. Defaults to the DISA STIG profile where
      the datastream has one (ubuntu2204, rhel8, rhel9, rhel10); otherwise CIS
      Level 1 Server for debian12, Chainguard GPOS for wolfi, and standard for
      fedora. Use it to scan against CIS, PCI-DSS, ANSSI and so on.
    default: ""
  output_dir:
    description: Where report.html, results.xml and scan-plan.env land.
    default: build/stig
  donor_image:
    description: >
      Image used as the root-privileged extraction helper (so tar -xf keeps
      the target image's UIDs and GIDs), the root helper for distroless dpkg
      status synthesis and the rootfs_path socket check, and the source of
      SCAP datastreams for RPM-family targets. Empty uses the orb's
      digest-pinned cgr.dev/chainguard/openscap:latest-dev. An override needs
      a shell and a POSIX userland (tar, find, awk, cp; busybox is enough)
      and the SCAP content under /usr/share/xml/scap/ssg/content.
    default: ""
  no_output_timeout:
    description: >
      CircleCI's no_output_timeout for this command's step, kept so the inputs
      match the command. It has no effect on GitHub Actions; set
      timeout-minutes on the job or step instead.
    default: 30m

runs:
  using: composite
  steps:
    - name: STIG scan
      shell: bash
      env:
        PARAM_IMAGE: ${{ inputs.image }}
        PARAM_ROOTFS_PATH: ${{ inputs.rootfs_path }}
        PARAM_TARGET_BASE: ${{ inputs.target_base }}
        PARAM_SCANNER_IMAGE: ${{ inputs.scanner_image }}
        PARAM_DATASTREAM_NAME: ${{ inputs.datastream_name }}
        PARAM_DATASTREAM_PATH: ${{ inputs.datastream_path }}
        PARAM_CHECKLIST_ANSWERS: ${{ inputs.checklist_answers }}
        PARAM_TAILORING_FILE: ${{ inputs.tailoring_file }}
        PARAM_PROFILE_ID: ${{ inputs.profile_id }}
        PARAM_OUTPUT_DIR: ${{ inputs.output_dir }}
        PARAM_DONOR_IMAGE: ${{ inputs.donor_image }}
      run: bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/scan.sh"
