description: >
  Generate offline STIG Viewer CKL and CKLB checklists from results.xml.
  DISA STIG profiles use verified pinned content or a supplied DISA skeleton.
  Conversion failures are recorded in checklist-meta.json; summarize enforces the policy.

parameters:
  output_dir:
    type: string
    default: "build/stig"
    description: Same value as passed to scan.
  checklist:
    type: enum
    enum: ["auto", "require", "none"]
    default: auto
    description: >
      auto generates supported STIG checklists and allows documented skips;
      require also fails skips at summarize; none disables generation.
  checklist_formats:
    type: string
    default: "ckl,cklb"
    description: Comma-separated ckl and/or cklb, case-insensitive.
  stig_xccdf_path:
    type: string
    default: ""
    description: >
      Runner-readable DISA manual XCCDF file or ZIP (16 MiB maximum).
      Read offline from one in-memory snapshot; overrides the checklist release.
  checklist_asset_name:
    type: string
    default: ""
    description: >
      Stable asset name. Defaults to the image reference in image mode;
      required for rootfs_path scans. Sanitized and capped at 255 characters.

steps:
  - run:
      name: Stage bundled DISA reference (rhel8)
      environment:
        PARAM_CHECKLIST: <<parameters.checklist>>
      command: <<include(scripts/stig-data/rhel8.sh)>>
  - run:
      name: Stage bundled DISA reference (rhel9)
      environment:
        PARAM_CHECKLIST: <<parameters.checklist>>
      command: <<include(scripts/stig-data/rhel9.sh)>>
  - run:
      name: Stage bundled DISA reference (rhel10)
      environment:
        PARAM_CHECKLIST: <<parameters.checklist>>
      command: <<include(scripts/stig-data/rhel10.sh)>>
  - run:
      name: Stage bundled DISA reference (ubuntu2204)
      environment:
        PARAM_CHECKLIST: <<parameters.checklist>>
      command: <<include(scripts/stig-data/ubuntu2204.sh)>>
  - run:
      name: Generate STIG Viewer checklists
      environment:
        PARAM_OUTPUT_DIR: <<parameters.output_dir>>
        PARAM_CHECKLIST: <<parameters.checklist>>
        PARAM_CHECKLIST_FORMATS: <<parameters.checklist_formats>>
        PARAM_STIG_XCCDF_PATH: <<parameters.stig_xccdf_path>>
        PARAM_CHECKLIST_ASSET_NAME: <<parameters.checklist_asset_name>>
      command: <<include(scripts/checklist.sh)>>
