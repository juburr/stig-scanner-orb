description: >
  Parse results.xml, write a human-readable summary.txt, apply the
  optional ignore-list, and enforce the gates. fail_on covers
  non-ignored fail results on rules at or above a severity.
  fail_on_scan_error covers error and unknown results and missing
  package inventory. require_evaluated_rules fails the job when nothing
  evaluated to pass or fail, so a mis-dispatched, all-notapplicable
  scan cannot pass as a clean one.

parameters:
  defer_gate:
    type: boolean
    default: false
    description: >
      Record policy exit status for enforce-gate.sh instead of exiting 1.
      Used by the scan job to upload validated artifacts before enforcing
      compliance, scan-quality and checklist policies. Parsing/configuration
      errors still fail.
  checklist:
    type: enum
    enum: ["auto", "require", "none"]
    default: none
    description: >
      Checklist gate: auto fails conversion errors; require also fails skips;
      none preserves standalone scan/summarize callers. Valid meta is reported
      in every mode. Pass the same value used by the generate_checklist command.
  output_dir:
    type: string
    default: "build/stig"
    description: Same value as passed to the `scan` command.
  fail_on:
    type: enum
    enum: ["high", "medium", "low", "info", "never"]
    default: never
    description: >
      Exit non-zero when any non-ignored fail result (a compliance
      finding) is on a rule at or above this severity. high, medium, and
      low are DISA CAT I, II, and III; info counts every severity. A rule
      with no stated severity counts at every level. The default, never,
      reports findings without failing, so a baseline that actually
      evaluated rules can be triaged before being gated. Scan-quality
      issues and an unevaluated scan still fail; see fail_on_scan_error
      and require_evaluated_rules.
  fail_on_scan_error:
    type: boolean
    default: true
    description: >
      Exit non-zero on any error or unknown result, or package inventory
      (dpkg or RPM) that scan-plan.env records as missing, at every
      severity and whatever ignore_findings lists. Set false only to keep
      incomplete evidence on purpose. Without scan-plan.env, only error
      and unknown results can be detected.
  require_evaluated_rules:
    type: boolean
    default: true
    description: >
      Fail the job when zero rules evaluate to pass, fail, fixed, or
      informational. An all-notapplicable scan usually means the scan
      was mis-dispatched (wrong target_base, a scanner missing the probe
      family the datastream needs) and is not evidence of compliance.
      Set false only on a job that intentionally records an
      all-notapplicable baseline. The summary says so either way.
  ignore_findings:
    type: string
    default: ""
    description: >
      Comma-separated rule IDs whose fail results to subtract from the
      fail_on count (still surfaced in summary.txt as ignored). Error and
      unknown results are never ignored; they count toward
      fail_on_scan_error. Accepted
      forms per entry: short DISA id ("SV-257779r925318"), full XCCDF
      rule id, or any CCE/STIG ident from the rule's <ident> or
      <reference> text. Matching is case-insensitive and whitespace-
      tolerant.

steps:
  - run:
      name: Summarize STIG results and apply gate
      environment:
        PARAM_OUTPUT_DIR: << parameters.output_dir >>
        PARAM_DEFER_GATE: << parameters.defer_gate >>
        PARAM_CHECKLIST: << parameters.checklist >>
        PARAM_FAIL_ON: << parameters.fail_on >>
        PARAM_FAIL_ON_SCAN_ERROR: << parameters.fail_on_scan_error >>
        PARAM_REQUIRE_EVALUATED_RULES: << parameters.require_evaluated_rules >>
        PARAM_IGNORE_FINDINGS: << parameters.ignore_findings >>
      command: << include(scripts/summarize.sh) >>
