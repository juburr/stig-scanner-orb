description: >
  Scan a RHEL 9 container with CIS Level 1, a profile that evaluates
  rules that apply to a container, and fail the job on any non-ignored
  fail, error, or unknown result. The DISA STIG host profile does not
  do this: against a container it is mostly notapplicable, the job
  fails closed, and require_evaluated_rules: false only records that
  baseline. It is not evidence of compliance. Replace ignore_findings
  with ids copied from summary.txt after a baseline run; an id that
  matches nothing has no effect.

usage:
  version: 2.1
  orbs:
    stig-scanner-orb: juburr/stig-scanner-orb@1.0.0
  workflows:
    scan:
      jobs:
        - stig-scanner-orb/scan:
            image: registry.access.redhat.com/ubi9/ubi:latest
            target_base: rhel9
            profile_id: xccdf_org.ssgproject.content_profile_cis_server_l1
            fail_on_finding: true
            ignore_findings: "xccdf_org.ssgproject.content_rule_example_replace_me"
