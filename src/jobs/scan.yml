description: >
  End-to-end DISA STIG scan against a container image. Loads an image
  tarball if supplied, runs the scan, summarizes + applies the gate,
  and stores the output directory as artifacts even on failure so the
  evidence is always retrievable.

executor:
  name: machine
  resource_class: <<parameters.resource_class>>

parameters:
  checklist:
    type: enum
    enum: ["auto", "require", "none"]
    default: auto
    description: Generate supported STIG checklists; require also fails skips.
  checklist_formats:
    type: string
    default: "ckl,cklb"
    description: Comma-separated ckl and/or cklb, case-insensitive.
  checklist_asset_name:
    type: string
    default: ""
    description: Stable asset name; required for rootfs_path checklists.
  image:
    type: string
    default: ""
    description: Image tag to scan. Mutually exclusive with rootfs_path.
  rootfs_path:
    type: string
    default: ""
    description: >
      Offline, already-extracted filesystem path to scan via
      oscap-chroot. Never a live filesystem such as /: a tree
      containing a socket, FIFO or device node (extract without dev/),
      or overlapping output_dir or TMPDIR, is refused.
  image_tarball:
    type: string
    default: ""
    description: Optional docker-saved tar to docker-load before the scan.
  target_base:
    type: enum
    enum: ["auto", "wolfi", "debian12", "ubuntu2204", "rhel8", "rhel9", "rhel10", "fedora"]
    default: auto
  scanner_image:
    type: string
    default: ""
    description: >
      Override the scanner image. Empty uses the orb's digest-pinned
      default for the target_base.
  datastream_name:
    type: string
    default: ""
  datastream_path:
    type: string
    default: ""
  profile_id:
    type: string
    default: ""
  donor_image:
    type: string
    default: ""
    description: >
      Root-privileged helper and datastream source. Empty uses the orb's
      digest-pinned Chainguard openscap image. An override needs a shell
      and a POSIX userland (tar, find, awk, cp, ...; busybox is enough).
  fail_on_finding:
    type: boolean
    default: false
    description: >
      When true, exit 1 if any non-ignored result is fail, error, or
      unknown. Default false so evaluated findings can be triaged
      first. Does not waive an unevaluated scan.
  require_evaluated_rules:
    type: boolean
    default: true
    description: >
      Fail the job when zero rules evaluate to pass, fail, fixed, or
      informational. Set false only on a job that intentionally
      records an all-notapplicable baseline. The summary states that
      such a result is not evidence of compliance.
  ignore_findings:
    type: string
    default: ""
  output_dir:
    type: string
    default: "build/stig"
  resource_class:
    type: string
    default: "medium"
  no_output_timeout:
    type: string
    default: "30m"
    description: >
      OpenSCAP can be silent for several minutes during evaluation,
      especially on RHEL datastreams (~28 MB). Default 30m is generous;
      shorten only if you know your scan completes quickly.
  checkout:
    type: boolean
    default: true
    description: >
      Whether to run `checkout` before the scan. Disable for minimal
      jobs that don't need the consumer's source tree. CircleCI's
      built-in pre-steps / post-steps job injection points are still
      available for callers needing arbitrary steps around the scan.

steps:
  - when:
      condition: <<parameters.checkout>>
      steps: [checkout]
  - run:
      name: Reserve output directory
      environment:
        PARAM_OUTPUT_DIR: <<parameters.output_dir>>
        PARAM_ROOTFS_PATH: <<parameters.rootfs_path>>
      command: <<include(scripts/reserve-output.sh)>>
  - load_image:
      image_tarball: <<parameters.image_tarball>>
  - scan:
      image: <<parameters.image>>
      rootfs_path: <<parameters.rootfs_path>>
      target_base: <<parameters.target_base>>
      scanner_image: <<parameters.scanner_image>>
      datastream_name: <<parameters.datastream_name>>
      datastream_path: <<parameters.datastream_path>>
      profile_id: <<parameters.profile_id>>
      output_dir: <<parameters.output_dir>>
      donor_image: <<parameters.donor_image>>
      no_output_timeout: <<parameters.no_output_timeout>>
  - checklist:
      output_dir: <<parameters.output_dir>>
      checklist: <<parameters.checklist>>
      checklist_formats: <<parameters.checklist_formats>>
      checklist_asset_name: <<parameters.checklist_asset_name>>
  - summarize:
      defer_gate: true
      checklist: <<parameters.checklist>>
      output_dir: <<parameters.output_dir>>
      fail_on_finding: <<parameters.fail_on_finding>>
      require_evaluated_rules: <<parameters.require_evaluated_rules>>
      ignore_findings: <<parameters.ignore_findings>>
  # Preserve ordinary evidence before the guard can fail. Never
  # upload output_dir wholesale: it may contain an unremovable bad checklist.
  - store_artifacts:
      path: <<parameters.output_dir>>/results.xml
      destination: stig/results.xml
      when: always
  - store_artifacts:
      path: <<parameters.output_dir>>/report.html
      destination: stig/report.html
      when: always
  - store_artifacts:
      path: <<parameters.output_dir>>/summary.txt
      destination: stig/summary.txt
      when: always
  - store_artifacts:
      path: <<parameters.output_dir>>/provenance.json
      destination: stig/provenance.json
      when: always
  - store_artifacts:
      path: <<parameters.output_dir>>/scan-plan.env
      destination: stig/scan-plan.env
      when: always
  - store_artifacts:
      path: <<parameters.output_dir>>/checklist-meta.json
      destination: stig/checklist-meta.json
      when: always
  - run:
      name: Guard checklist artifacts before upload
      when: always
      environment:
        PARAM_OUTPUT_DIR: <<parameters.output_dir>>
        PARAM_ROOTFS_PATH: <<parameters.rootfs_path>>
        PARAM_CHECKLIST_GUARD: "true"
      command: <<include(scripts/checklist.sh)>>
  - store_artifacts:
      path: <<parameters.output_dir>>/checklist.ckl
      destination: stig/checklist.ckl
      when: on_success
  - store_artifacts:
      path: <<parameters.output_dir>>/checklist.cklb
      destination: stig/checklist.cklb
      when: on_success
  # Expected policy failures are deferred until after artifact upload. An
  # actual scan, parse, or guard failure already prevents checklist uploads.
  - run:
      name: Enforce summarized scan policies
      when: always
      environment:
        PARAM_OUTPUT_DIR: <<parameters.output_dir>>
        PARAM_ROOTFS_PATH: <<parameters.rootfs_path>>
      command: <<include(scripts/enforce-gate.sh)>>
