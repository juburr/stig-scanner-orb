version: 2.1

orbs:
  orb-tools: circleci/orb-tools@12.3
  # The orb definition is injected into the pipeline by the setup workflow.
  stig-scanner-orb: {}

filters: &filters
  tags:
    only: /.*/

release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  smoke-wolfi:
    description: >
      Scan a tiny known Wolfi-based image and assert the orb's summary
      shows real signal — pass and notapplicable counts both nonzero.
      Catches regressions in scan.sh, summarize.sh, and the Chainguard
      datastream wiring.
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Pull a tiny Wolfi target into the local docker daemon
          command: docker pull cgr.dev/chainguard/static:latest
      - stig-scanner-orb/scan:
          image: cgr.dev/chainguard/static:latest
          target_base: wolfi
          output_dir: build/stig
      - stig-scanner-orb/summarize:
          output_dir: build/stig
          fail_on_finding: false
      - run:
          name: Assert summary shows real signal
          command: |
            set -e
            test -f build/stig/summary.txt
            test -f build/stig/results.xml
            test -f build/stig/report.html
            grep -q "target-base:    wolfi" build/stig/summary.txt
            pass=$(awk '/^  pass / {print $2}' build/stig/summary.txt)
            na=$(awk '/^  notapplicable / {print $2}' build/stig/summary.txt)
            echo "pass=${pass:-0} notapplicable=${na:-0}"
            test "${pass:-0}" -gt 50 || { echo "expected >50 pass rules"; exit 1; }
            test "${na:-0}" -gt 50 || { echo "expected >50 notapplicable rules"; exit 1; }
            if grep -q "not evidence of compliance" build/stig/summary.txt; then
              echo "wolfi scan was hollow; expected evaluated rules"
              exit 1
            fi
      - run:
          name: Assert provenance records the pinned scanner
          command: |
            set -e
            test -f build/stig/provenance.json
            grep -q "^Provenance:" build/stig/summary.txt
            pinned=$(sed -n 's/^DEFAULT_CHAINGUARD_IMAGE="[^@]*@\(sha256:[0-9a-f]*\)"$/\1/p' src/scripts/scan.sh)
            test -n "$pinned"
            python3 -c '
            import json, re, sys
            pinned = sys.argv[1]
            p = json.load(open("build/stig/provenance.json"))
            print(json.dumps(p, indent=2))
            assert any(d.endswith("@" + pinned) for d in p["scanner"]["repo_digests"]), "scanner digest is not the pin"
            assert p["scanner"]["openscap_version"], "no openscap version"
            assert p["datastream"]["source"] == "bundled"
            assert re.fullmatch(r"[0-9a-f]{64}", p["datastream"]["sha256"] or ""), "datastream not hashed"
            assert p["datastream"]["benchmark_version"], "no benchmark version"
            assert p["target"]["repo_digests"], "target pulled from cgr.dev must have a repo digest"
            assert p["donor"]["used_for"] == ["extraction"]
            assert p["scanner"]["platform"].startswith("linux/"), "scanner platform not recorded"
            assert p["target"]["platform"] == p["scanner"]["platform"], "target/scanner platform mismatch on one runner"
            ' "$pinned"
      - store_artifacts:
          path: build/stig
          destination: smoke-wolfi

  smoke-gate:
    description: >
      Verify the failure gate and ignore-list logic by scanning the
      same Wolfi target, then re-running summarize twice — once with
      the gate on and no ignores (must exit 1), once with the gate on
      and the actual failures listed (must exit 0).
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Produce a results.xml with known failures
          command: docker pull cgr.dev/chainguard/static:latest
      - stig-scanner-orb/scan:
          image: cgr.dev/chainguard/static:latest
          target_base: wolfi
          output_dir: build/stig
      - stig-scanner-orb/summarize:
          output_dir: build/stig
          fail_on_finding: false
      - run:
          name: Gate ON, no ignores → expect exit 1
          command: |
            set +e
            PARAM_OUTPUT_DIR="build/stig" \
            PARAM_FAIL_ON_FINDING="true" \
            PARAM_IGNORE_FINDINGS="" \
            bash src/scripts/summarize.sh >/dev/null 2>&1
            rc=$?
            test "$rc" -eq 1 || { echo "expected exit 1, got $rc"; exit 1; }
      - run:
          name: Gate ON, ignore all real failures → expect exit 0
          command: |
            set -e
            # Short ids from the Fail, Error, and Unknown sections. SV-only
            # matching would miss an error result whose id is not a DISA id,
            # and fail_on_finding now counts those.
            fails=$(awk '
              /^Fail \(/ || /^Error \(/ || /^Unknown \(/ {section=1; next}
              /^Notchecked \(/ || /^[A-Za-z]/ {section=0}
              section && $1 == "-" {
                if ($2 == "[IGNORED]") print $3; else print $2
              }
            ' build/stig/summary.txt | sort -u | paste -sd, -)
            test -n "$fails" || { echo "no failures parsed; smoke-wolfi precondition broken"; exit 1; }
            PARAM_OUTPUT_DIR="build/stig" \
            PARAM_FAIL_ON_FINDING="true" \
            PARAM_IGNORE_FINDINGS="$fails" \
            bash src/scripts/summarize.sh >/dev/null 2>&1

  smoke-hollow:
    description: >
      Real-scanner proof that require_evaluated_rules fails closed. Scans
      a Wolfi image with target_base forced to rhel9: the RHEL platform
      check never matches, so every selected rule is notapplicable. A
      mis-dispatched target or a scanner without rpm probes produces the
      same all-notapplicable result, and before this gate it was a green
      build.
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Pull a Wolfi target
          command: docker pull cgr.dev/chainguard/static:latest
      - stig-scanner-orb/scan:
          image: cgr.dev/chainguard/static:latest
          target_base: rhel9
          output_dir: build/stig
      - run:
          name: Default gate on a hollow scan → expect exit 1
          command: |
            set +e
            PARAM_OUTPUT_DIR="build/stig" bash src/scripts/summarize.sh
            rc=$?
            set -e
            test "$rc" -eq 1 || { echo "expected exit 1, got $rc"; exit 1; }
            grep -q "^Evaluated rules: 0$" build/stig/summary.txt
            grep -q "not evidence of compliance" build/stig/summary.txt
      - run:
          name: Explicit opt-out → expect exit 0, warning still recorded
          command: |
            set -e
            PARAM_OUTPUT_DIR="build/stig" \
            PARAM_REQUIRE_EVALUATED_RULES="false" \
            bash src/scripts/summarize.sh
            grep -q "require_evaluated_rules=false" build/stig/summary.txt
            grep -q "not evidence of compliance" build/stig/summary.txt

  test-scripts:
    description: >
      Docker-free script tests: summarize gate fixtures (hollow scans
      fail closed, error/unknown gating, ignore-list behavior),
      provenance rendering, and the pinned default image references.
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Run tests/*_test.sh
          command: |
            set -e
            for t in tests/*_test.sh; do
              echo "==> ${t}"
              bash "${t}"
            done

workflows:
  test-deploy:
    jobs:
      - smoke-wolfi:
          filters: *filters
      - smoke-gate:
          filters: *filters
      - smoke-hollow:
          filters: *filters
      - test-scripts:
          filters: *filters
      # Broader coverage: every supported family + every input mode, each
      # exercised through the real `stig-scanner-orb/scan` JOB (so the
      # machine executor and the load -> scan -> summarize -> store_artifacts
      # wiring are covered too, not just the commands). Count thresholds are
      # deliberately loose — well below locally-observed values — so routine
      # ComplianceAsCode/SSG content updates don't make these flaky.
      - stig-scanner-orb/scan:
          name: smoke-ubuntu2204
          # dpkg probe family via the Chainguard scanner; also leaves the
          # job's default `checkout: true` on, so that path is covered once.
          image: ubuntu:22.04
          target_base: ubuntu2204
          post-steps:
            - run:
                name: Assert dpkg-probe signal
                command: |
                  set -e
                  test -f build/stig/summary.txt
                  test -f build/stig/results.xml
                  test -f build/stig/report.html
                  grep -q "target-base:    ubuntu2204" build/stig/summary.txt
                  pass=$(awk '/^  pass / {print $2}' build/stig/summary.txt)
                  na=$(awk '/^  notapplicable / {print $2}' build/stig/summary.txt)
                  echo "pass=${pass:-0} notapplicable=${na:-0}"
                  test "${pass:-0}" -gt 5
                  test "${na:-0}" -gt 50
          filters: *filters
      - stig-scanner-orb/scan:
          name: smoke-debian12-auto
          # Also exercises `target_base: auto` (os-release ID=debian, 12 ->
          # debian12) on top of the debian12 datastream + anssi profile.
          image: debian:12-slim
          target_base: auto
          checkout: false
          post-steps:
            - run:
                name: Assert auto-detect resolves debian12 + dpkg signal
                command: |
                  set -e
                  grep -q "target-base:    debian12" build/stig/summary.txt
                  pass=$(awk '/^  pass / {print $2}' build/stig/summary.txt)
                  na=$(awk '/^  notapplicable / {print $2}' build/stig/summary.txt)
                  echo "pass=${pass:-0} notapplicable=${na:-0}"
                  test "${pass:-0}" -gt 3
                  test "${na:-0}" -gt 10
          filters: *filters
      - stig-scanner-orb/scan:
          name: smoke-rhel9
          # The whole RPM path: compliance-operator scanner + datastream
          # donated from the Chainguard image + rpm probes. ubi9 is pulled
          # from registry.access.redhat.com (not Docker Hub) to dodge
          # anonymous pull-rate limits.
          #
          # NOTE: the DISA STIG for RHEL profile is a HOST benchmark. Most
          # of it (~400 rules) is notapplicable against a container, but
          # the container-applicable subset (file permissions/ownership,
          # package-removal checks, crypto policy) does evaluate: ~70 rules
          # against ubi9. require_evaluated_rules stays at its default, so
          # the job itself fails if the scan ever goes hollow (e.g. a
          # scanner without rpm probes). Assert evaluated > 0 and the N/A
          # baseline; never a pass-count threshold, which drifts with SSG.
          image: registry.access.redhat.com/ubi9/ubi:latest
          target_base: rhel9
          checkout: false
          post-steps:
            - run:
                name: Assert RPM dispatch + evaluated host-STIG subset
                command: |
                  set -e
                  test -f build/stig/results.xml
                  test -f build/stig/report.html
                  grep -q "scanner=quay.io/compliance-operator" build/stig/scan-plan.env
                  grep -q "datastream=ssg-rhel9-ds.xml" build/stig/scan-plan.env
                  grep -q "family=rpm" build/stig/scan-plan.env
                  python3 -c '
                  import json, re
                  p = json.load(open("build/stig/provenance.json"))
                  assert any(d.startswith("quay.io/compliance-operator/openscap-ocp@sha256:") for d in p["scanner"]["repo_digests"])
                  assert p["datastream"]["source"] == "donated"
                  assert re.fullmatch(r"[0-9a-f]{64}", p["datastream"]["sha256"] or "")
                  assert p["datastream"]["ssg_version"], "RHEL datastream is SSG content"
                  assert p["donor"]["used_for"] == ["extraction", "datastream"]
                  assert p["target_base"]["resolved"] == "rhel9"
                  assert p["scanner"]["platform"] == "linux/amd64", p["scanner"]
                  assert p["donor"]["platform"].startswith("linux/"), p["donor"]
                  '
                  na=$(awk '/^  notapplicable / {print $2}' build/stig/summary.txt)
                  ev=$(awk '/^Evaluated rules:/ {print $3}' build/stig/summary.txt)
                  echo "evaluated=${ev:-0} notapplicable=${na:-0}"
                  test "${na:-0}" -gt 50
                  test "${ev:-0}" -gt 0
                  if grep -q "not evidence of compliance" build/stig/summary.txt; then
                    echo "host-STIG scan was hollow; expected evaluated rules"
                    exit 1
                  fi
          filters: *filters
      - stig-scanner-orb/scan:
          name: smoke-rhel9-cis
          # profile_id override coverage on the RPM path. CIS Level 1 is
          # the profile consumers pair with the host STIG for broader
          # container-applicable signal, so this proves both that the
          # override flows through to the scan and that it evaluates rules.
          image: registry.access.redhat.com/ubi9/ubi:latest
          target_base: rhel9
          profile_id: xccdf_org.ssgproject.content_profile_cis_server_l1
          checkout: false
          post-steps:
            - run:
                name: Assert profile_id override + actionable CIS signal
                command: |
                  set -e
                  grep -q "profile=xccdf_org.ssgproject.content_profile_cis_server_l1" build/stig/scan-plan.env
                  pass=$(awk '/^  pass / {print $2}' build/stig/summary.txt)
                  fail=$(awk '/^  fail / {print $2}' build/stig/summary.txt)
                  echo "pass=${pass:-0} fail=${fail:-0}"
                  # CIS (unlike the host STIG profile) evaluates container-
                  # applicable rules, so at least some pass/fail must appear.
                  test "$(( ${pass:-0} + ${fail:-0} ))" -gt 0
                  if grep -q "not evidence of compliance" build/stig/summary.txt; then
                    echo "CIS scan was hollow; expected evaluated rules"
                    exit 1
                  fi
          filters: *filters
      - stig-scanner-orb/scan:
          name: smoke-rhel8-auto
          # Covers TWO gaps at once: rhel8 (its own ssg-rhel8-ds.xml +
          # donation path; the most common DoD RHEL target) AND
          # target_base: auto on the RPM family (os-release ID=rhel,
          # VERSION_ID 8 -> rhel8). ubi8 from the Red Hat registry dodges
          # Docker Hub pull-rate limits. Same host-STIG shape as rhel9:
          # mostly notapplicable, ~50 evaluated rules, default gate on.
          image: registry.access.redhat.com/ubi8/ubi:latest
          target_base: auto
          checkout: false
          post-steps:
            - run:
                name: Assert auto-detect resolves rhel8 + RPM dispatch
                command: |
                  set -e
                  grep -q "target_base=rhel8" build/stig/scan-plan.env
                  grep -q "datastream=ssg-rhel8-ds.xml" build/stig/scan-plan.env
                  grep -q "family=rpm" build/stig/scan-plan.env
                  na=$(awk '/^  notapplicable / {print $2}' build/stig/summary.txt)
                  ev=$(awk '/^Evaluated rules:/ {print $3}' build/stig/summary.txt)
                  echo "evaluated=${ev:-0} notapplicable=${na:-0}"
                  test "${na:-0}" -gt 50
                  test "${ev:-0}" -gt 0
                  if grep -q "not evidence of compliance" build/stig/summary.txt; then
                    echo "host-STIG scan was hollow; expected evaluated rules"
                    exit 1
                  fi
          filters: *filters
      - stig-scanner-orb/scan:
          name: smoke-fedora
          # Second RPM datastream/profile (fedora / standard) through the
          # same compliance-operator + donation path. Pulled from quay.io
          # (not Docker Hub) to dodge anonymous pull-rate limits.
          #
          # We assert the dispatch markers + a complete, parseable scan
          # rather than a pass/N-A count: the fedora 'standard' profile's
          # result distribution against a container isn't pinned, and SSG
          # content drift would make a hard count threshold flaky. The
          # default require_evaluated_rules gate still fails the job if the
          # scan evaluates nothing (~12 rules evaluate today).
          image: quay.io/fedora/fedora:latest
          target_base: fedora
          checkout: false
          post-steps:
            - run:
                name: Assert fedora RPM dispatch + complete scan output
                command: |
                  set -e
                  test -f build/stig/results.xml
                  test -f build/stig/report.html
                  grep -q "datastream=ssg-fedora-ds.xml" build/stig/scan-plan.env
                  grep -q "family=rpm" build/stig/scan-plan.env
                  grep -q "^Rule results:" build/stig/summary.txt
          filters: *filters
      - stig-scanner-orb/scan:
          name: smoke-datastream-path
          # datastream_path mode with the file in a private (0700) directory,
          # the way a consumer-supplied datastream often lands (mktemp -d).
          # The Chainguard scanner's default user (65532) can't traverse that
          # directory; the scan runs as root and must hash the file as root
          # too, or provenance silently loses datastream.sha256.
          image: cgr.dev/chainguard/static:latest
          target_base: wolfi
          datastream_path: /tmp/ds-private/ssg-chainguard-gpos-ds.xml
          checkout: false
          pre-steps:
            - run:
                name: Stage a datastream in a private directory
                command: |
                  set -e
                  mkdir -m 0700 /tmp/ds-private
                  docker run --rm --entrypoint cat cgr.dev/chainguard/openscap:latest-dev \
                    /usr/share/xml/scap/ssg/content/ssg-chainguard-gpos-ds.xml \
                    > /tmp/ds-private/ssg-chainguard-gpos-ds.xml
                  chmod 0600 /tmp/ds-private/ssg-chainguard-gpos-ds.xml
                  test -s /tmp/ds-private/ssg-chainguard-gpos-ds.xml
          post-steps:
            - run:
                name: Assert the supplied datastream was evaluated and hashed
                command: |
                  set -e
                  want=$(sha256sum /tmp/ds-private/ssg-chainguard-gpos-ds.xml | cut -d' ' -f1)
                  python3 -c '
                  import json, sys
                  want = sys.argv[1]
                  p = json.load(open("build/stig/provenance.json"))
                  ds = p["datastream"]
                  print(json.dumps(ds, indent=2))
                  assert ds["source"] == "datastream_path", ds
                  assert ds["name"] == "ssg-chainguard-gpos-ds.xml", ds
                  assert ds["sha256"] == want, "recorded sha256 is not the supplied file"
                  assert p["donor"]["used_for"] == ["extraction"], p["donor"]
                  ' "$want"
          filters: *filters
      - stig-scanner-orb/scan:
          name: smoke-rootfs
          # rootfs_path mode: scan an already-extracted tree, skipping the
          # docker-export step entirely.
          rootfs_path: /tmp/stig-rootfs
          target_base: wolfi
          checkout: false
          pre-steps:
            - run:
                name: Stage an extracted rootfs
                command: |
                  set -e
                  cid=$(docker create --entrypoint /placeholder cgr.dev/chainguard/static:latest)
                  mkdir -p /tmp/stig-rootfs
                  docker export "$cid" | tar -C /tmp/stig-rootfs -xf - --numeric-owner --exclude='dev/*'
                  docker rm "$cid"
          post-steps:
            - run:
                name: Assert rootfs-mode outputs
                command: |
                  set -e
                  test -f build/stig/results.xml
                  test -f build/stig/report.html
                  grep -q "target-rootfs:" build/stig/summary.txt
                  na=$(awk '/^  notapplicable / {print $2}' build/stig/summary.txt)
                  echo "notapplicable=${na:-0}"
                  test "${na:-0}" -gt 50
          filters: *filters
      - stig-scanner-orb/scan:
          name: smoke-tarball
          # image_tarball / load_image mode. The tag is local-only and NOT
          # pullable, so the scan can only succeed if load_image actually
          # loaded the tar — a real test of that path, not a no-op.
          image: localhost/stig-tarball-smoke:latest
          image_tarball: /tmp/stig-image.tar
          target_base: wolfi
          checkout: false
          pre-steps:
            - run:
                name: Build a non-pullable image tarball
                command: |
                  set -e
                  docker pull cgr.dev/chainguard/static:latest
                  docker tag cgr.dev/chainguard/static:latest localhost/stig-tarball-smoke:latest
                  docker save localhost/stig-tarball-smoke:latest -o /tmp/stig-image.tar
                  docker rmi localhost/stig-tarball-smoke:latest cgr.dev/chainguard/static:latest
          post-steps:
            - run:
                name: Assert scan ran against the tarball-loaded image
                command: |
                  set -e
                  test -f build/stig/summary.txt
                  na=$(awk '/^  notapplicable / {print $2}' build/stig/summary.txt)
                  echo "notapplicable=${na:-0}"
                  test "${na:-0}" -gt 50
          filters: *filters
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: juburr/stig-scanner-orb
          vcs_type: << pipeline.project.type >>
          pub_type: production
          requires:
            - orb-tools/pack
            - smoke-wolfi
            - smoke-gate
            - smoke-hollow
            - test-scripts
            - smoke-ubuntu2204
            - smoke-debian12-auto
            - smoke-rhel8-auto
            - smoke-rhel9
            - smoke-rhel9-cis
            - smoke-fedora
            - smoke-datastream-path
            - smoke-rootfs
            - smoke-tarball
          context: orb-publishing
          filters: *release-filters
