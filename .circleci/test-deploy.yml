version: 2.1

orbs:
  orb-tools: circleci/orb-tools@12.3
  # The orb definition is injected into the pipeline by the setup workflow.
  stig-scanner-orb: {}

filters: &filters
  tags:
    only: /.*/

release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  smoke-wolfi:
    description: >
      Scan a tiny known Wolfi-based image and assert the orb's summary
      shows real signal — pass and notapplicable counts both nonzero.
      Catches regressions in scan.sh, summarize.sh, and the Chainguard
      datastream wiring.
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Pull a tiny Wolfi target into the local docker daemon
          command: docker pull cgr.dev/chainguard/static:latest
      - stig-scanner-orb/scan:
          image: cgr.dev/chainguard/static:latest
          target_base: wolfi
          output_dir: build/stig
      - stig-scanner-orb/summarize:
          output_dir: build/stig
          fail_on_finding: false
      - run:
          name: Assert summary shows real signal
          command: |
            set -e
            test -f build/stig/summary.txt
            test -f build/stig/results.xml
            test -f build/stig/report.html
            grep -q "target-base:    wolfi" build/stig/summary.txt
            pass=$(awk '/^  pass / {print $2}' build/stig/summary.txt)
            na=$(awk '/^  notapplicable / {print $2}' build/stig/summary.txt)
            echo "pass=${pass:-0} notapplicable=${na:-0}"
            test "${pass:-0}" -gt 50 || { echo "expected >50 pass rules"; exit 1; }
            test "${na:-0}" -gt 50 || { echo "expected >50 notapplicable rules"; exit 1; }
      - store_artifacts:
          path: build/stig
          destination: smoke-wolfi

  smoke-gate:
    description: >
      Verify the failure gate and ignore-list logic by scanning the
      same Wolfi target, then re-running summarize twice — once with
      the gate on and no ignores (must exit 1), once with the gate on
      and the actual failures listed (must exit 0).
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Produce a results.xml with known failures
          command: docker pull cgr.dev/chainguard/static:latest
      - stig-scanner-orb/scan:
          image: cgr.dev/chainguard/static:latest
          target_base: wolfi
          output_dir: build/stig
      - stig-scanner-orb/summarize:
          output_dir: build/stig
          fail_on_finding: false
      - run:
          name: Gate ON, no ignores → expect exit 1
          command: |
            set +e
            PARAM_OUTPUT_DIR="build/stig" \
            PARAM_FAIL_ON_FINDING="true" \
            PARAM_IGNORE_FINDINGS="" \
            bash src/scripts/summarize.sh >/dev/null 2>&1
            rc=$?
            test "$rc" -eq 1 || { echo "expected exit 1, got $rc"; exit 1; }
      - run:
          name: Gate ON, ignore all real failures → expect exit 0
          command: |
            set -e
            fails=$(grep -oE 'SV-[0-9]+r[0-9]+' build/stig/summary.txt | sort -u | tr '\n' ',' | sed 's/,$//')
            test -n "$fails" || { echo "no failures parsed; smoke-wolfi precondition broken"; exit 1; }
            PARAM_OUTPUT_DIR="build/stig" \
            PARAM_FAIL_ON_FINDING="true" \
            PARAM_IGNORE_FINDINGS="$fails" \
            bash src/scripts/summarize.sh >/dev/null 2>&1

workflows:
  test-deploy:
    jobs:
      - smoke-wolfi:
          filters: *filters
      - smoke-gate:
          filters: *filters
      # Broader coverage: every supported family + every input mode, each
      # exercised through the real `stig-scanner-orb/scan` JOB (so the
      # machine executor and the load -> scan -> summarize -> store_artifacts
      # wiring are covered too, not just the commands). Count thresholds are
      # deliberately loose — well below locally-observed values — so routine
      # ComplianceAsCode/SSG content updates don't make these flaky.
      - stig-scanner-orb/scan:
          name: smoke-ubuntu2204
          # dpkg probe family via the Chainguard scanner; also leaves the
          # job's default `checkout: true` on, so that path is covered once.
          image: ubuntu:22.04
          target_base: ubuntu2204
          post-steps:
            - run:
                name: Assert dpkg-probe signal
                command: |
                  set -e
                  test -f build/stig/summary.txt
                  test -f build/stig/results.xml
                  test -f build/stig/report.html
                  grep -q "target-base:    ubuntu2204" build/stig/summary.txt
                  pass=$(awk '/^  pass / {print $2}' build/stig/summary.txt)
                  na=$(awk '/^  notapplicable / {print $2}' build/stig/summary.txt)
                  echo "pass=${pass:-0} notapplicable=${na:-0}"
                  test "${pass:-0}" -gt 5
                  test "${na:-0}" -gt 50
          filters: *filters
      - stig-scanner-orb/scan:
          name: smoke-debian12-auto
          # Also exercises `target_base: auto` (os-release ID=debian, 12 ->
          # debian12) on top of the debian12 datastream + anssi profile.
          image: debian:12-slim
          target_base: auto
          checkout: false
          post-steps:
            - run:
                name: Assert auto-detect resolves debian12 + dpkg signal
                command: |
                  set -e
                  grep -q "target-base:    debian12" build/stig/summary.txt
                  pass=$(awk '/^  pass / {print $2}' build/stig/summary.txt)
                  na=$(awk '/^  notapplicable / {print $2}' build/stig/summary.txt)
                  echo "pass=${pass:-0} notapplicable=${na:-0}"
                  test "${pass:-0}" -gt 3
                  test "${na:-0}" -gt 10
          filters: *filters
      - stig-scanner-orb/scan:
          name: smoke-rhel9
          # The whole RPM path: compliance-operator scanner + datastream
          # donated from the Chainguard image + rpm probes. ubi9 is pulled
          # from registry.access.redhat.com (not Docker Hub) to dodge
          # anonymous pull-rate limits.
          #
          # NOTE: the DISA STIG for RHEL profile is a HOST benchmark, so
          # against a container it yields ~0 pass / 0 fail / ~485 N/A (see
          # README + docs/spike-results.md). We assert the documented N/A
          # baseline and the RPM dispatch markers — NOT a pass count, which
          # is 0 here. For pass/fail signal on the RPM path see
          # smoke-rhel9-cis below.
          image: registry.access.redhat.com/ubi9/ubi:latest
          target_base: rhel9
          checkout: false
          post-steps:
            - run:
                name: Assert RPM dispatch + host-STIG N/A baseline
                command: |
                  set -e
                  test -f build/stig/results.xml
                  test -f build/stig/report.html
                  grep -q "scanner=quay.io/compliance-operator" build/stig/scan-plan.env
                  grep -q "datastream=ssg-rhel9-ds.xml" build/stig/scan-plan.env
                  grep -q "family=rpm" build/stig/scan-plan.env
                  na=$(awk '/^  notapplicable / {print $2}' build/stig/summary.txt)
                  echo "notapplicable=${na:-0}"
                  test "${na:-0}" -gt 50
          filters: *filters
      - stig-scanner-orb/scan:
          name: smoke-rhel9-cis
          # profile_id override coverage on the RPM path. The DISA STIG
          # profile is a host benchmark (≈0 evaluated rules against a
          # container); CIS Level 1 has file-permission and package rules
          # that DO evaluate, so this proves both that the override flows
          # through to the scan and that the RPM path can produce
          # actionable pass/fail signal.
          image: registry.access.redhat.com/ubi9/ubi:latest
          target_base: rhel9
          profile_id: xccdf_org.ssgproject.content_profile_cis_server_l1
          checkout: false
          post-steps:
            - run:
                name: Assert profile_id override + actionable CIS signal
                command: |
                  set -e
                  grep -q "profile=xccdf_org.ssgproject.content_profile_cis_server_l1" build/stig/scan-plan.env
                  pass=$(awk '/^  pass / {print $2}' build/stig/summary.txt)
                  fail=$(awk '/^  fail / {print $2}' build/stig/summary.txt)
                  echo "pass=${pass:-0} fail=${fail:-0}"
                  # CIS (unlike the host STIG profile) evaluates container-
                  # applicable rules, so at least some pass/fail must appear.
                  test "$(( ${pass:-0} + ${fail:-0} ))" -gt 0
          filters: *filters
      - stig-scanner-orb/scan:
          name: smoke-rhel8-auto
          # Covers TWO gaps at once: rhel8 (its own ssg-rhel8-ds.xml +
          # donation path; the most common DoD RHEL target) AND
          # target_base: auto on the RPM family (os-release ID=rhel,
          # VERSION_ID 8 -> rhel8). ubi8 from the Red Hat registry dodges
          # Docker Hub pull-rate limits. Same host-STIG N/A baseline as
          # rhel9.
          image: registry.access.redhat.com/ubi8/ubi:latest
          target_base: auto
          checkout: false
          post-steps:
            - run:
                name: Assert auto-detect resolves rhel8 + RPM dispatch
                command: |
                  set -e
                  grep -q "target_base=rhel8" build/stig/scan-plan.env
                  grep -q "datastream=ssg-rhel8-ds.xml" build/stig/scan-plan.env
                  grep -q "family=rpm" build/stig/scan-plan.env
                  na=$(awk '/^  notapplicable / {print $2}' build/stig/summary.txt)
                  echo "notapplicable=${na:-0}"
                  test "${na:-0}" -gt 50
          filters: *filters
      - stig-scanner-orb/scan:
          name: smoke-fedora
          # Second RPM datastream/profile (fedora / standard) through the
          # same compliance-operator + donation path. Pulled from quay.io
          # (not Docker Hub) to dodge anonymous pull-rate limits.
          #
          # We assert the dispatch markers + a complete, parseable scan
          # rather than a pass/N-A count: the fedora 'standard' profile's
          # result distribution against a container isn't pinned by the
          # spike, and SSG content drift would make a hard count threshold
          # flaky. The scan step itself fails on any oscap error, so valid
          # outputs here already prove the second RPM path works end-to-end.
          image: quay.io/fedora/fedora:latest
          target_base: fedora
          checkout: false
          post-steps:
            - run:
                name: Assert fedora RPM dispatch + complete scan output
                command: |
                  set -e
                  test -f build/stig/results.xml
                  test -f build/stig/report.html
                  grep -q "datastream=ssg-fedora-ds.xml" build/stig/scan-plan.env
                  grep -q "family=rpm" build/stig/scan-plan.env
                  grep -q "^Rule results:" build/stig/summary.txt
          filters: *filters
      - stig-scanner-orb/scan:
          name: smoke-rootfs
          # rootfs_path mode: scan an already-extracted tree, skipping the
          # docker-export step entirely.
          rootfs_path: /tmp/stig-rootfs
          target_base: wolfi
          checkout: false
          pre-steps:
            - run:
                name: Stage an extracted rootfs
                command: |
                  set -e
                  cid=$(docker create --entrypoint /placeholder cgr.dev/chainguard/static:latest)
                  mkdir -p /tmp/stig-rootfs
                  docker export "$cid" | tar -C /tmp/stig-rootfs -xf - --numeric-owner --exclude='dev/*'
                  docker rm "$cid"
          post-steps:
            - run:
                name: Assert rootfs-mode outputs
                command: |
                  set -e
                  test -f build/stig/results.xml
                  test -f build/stig/report.html
                  grep -q "target-rootfs:" build/stig/summary.txt
                  na=$(awk '/^  notapplicable / {print $2}' build/stig/summary.txt)
                  echo "notapplicable=${na:-0}"
                  test "${na:-0}" -gt 50
          filters: *filters
      - stig-scanner-orb/scan:
          name: smoke-tarball
          # image_tarball / load_image mode. The tag is local-only and NOT
          # pullable, so the scan can only succeed if load_image actually
          # loaded the tar — a real test of that path, not a no-op.
          image: localhost/stig-tarball-smoke:latest
          image_tarball: /tmp/stig-image.tar
          target_base: wolfi
          checkout: false
          pre-steps:
            - run:
                name: Build a non-pullable image tarball
                command: |
                  set -e
                  docker pull cgr.dev/chainguard/static:latest
                  docker tag cgr.dev/chainguard/static:latest localhost/stig-tarball-smoke:latest
                  docker save localhost/stig-tarball-smoke:latest -o /tmp/stig-image.tar
                  docker rmi localhost/stig-tarball-smoke:latest cgr.dev/chainguard/static:latest
          post-steps:
            - run:
                name: Assert scan ran against the tarball-loaded image
                command: |
                  set -e
                  test -f build/stig/summary.txt
                  na=$(awk '/^  notapplicable / {print $2}' build/stig/summary.txt)
                  echo "notapplicable=${na:-0}"
                  test "${na:-0}" -gt 50
          filters: *filters
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: juburr/stig-scanner-orb
          vcs_type: << pipeline.project.type >>
          pub_type: production
          requires:
            - orb-tools/pack
            - smoke-wolfi
            - smoke-gate
            - smoke-ubuntu2204
            - smoke-debian12-auto
            - smoke-rhel8-auto
            - smoke-rhel9
            - smoke-rhel9-cis
            - smoke-fedora
            - smoke-rootfs
            - smoke-tarball
          context: orb-publishing
          filters: *release-filters
